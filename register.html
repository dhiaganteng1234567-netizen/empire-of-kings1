<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#101827"
    >

    <title>Register | Empire of Kings</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/auth.css">

</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="index.html" class="auth-back">
            ← Kembali ke halaman utama
        </a>

        <section class="auth-card">

            <div class="auth-brand">

                <div class="auth-crown">
                    ♛
                </div>

                <h1>EMPIRE OF KINGS</h1>

                <p>Begin your journey.</p>

            </div>

            <div class="auth-heading">

                <h2>Register</h2>

                <p>Buat akun pemain baru.</p>

            </div>

            <form id="register-form">

                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username kamu"
                        minlength="3"
                        maxlength="20"
                        pattern="[A-Za-z0-9_]+"
                        autocomplete="username"
                        autocapitalize="none"
                        required
                    >

                    <small>
                        3–20 karakter. Gunakan huruf,
                        angka, dan underscore.
                    </small>

                </div>

                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        autocapitalize="none"
                        required
                    >

                </div>

                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimal 8 karakter"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="password"
                        >
                            Lihat
                        </button>

                    </div>

                </div>

                <div class="auth-field">

                    <label for="confirm-password">
                        Konfirmasi Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Ulangi password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="confirm-password"
                        >
                            Lihat
                        </button>

                    </div>

                </div>

                <p
                    id="auth-message"
                    class="auth-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="auth-button"
                    id="register-submit"
                >
                    Buat Akun
                </button>

            </form>

            <div class="auth-footer">

                Sudah memiliki akun?

                <a href="login.html">
                    Login
                </a>

            </div>

        </section>

        <p class="auth-copyright">
            © 2026 Empire of Kings
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

</body>
                            </html>
