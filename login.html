<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#101827"
    >

    <title>Login | Empire of Kings</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body class="auth-page">


    <main class="auth-container">


        <a
            href="index.html"
            class="auth-back"
        >

            ← Kembali ke halaman utama

        </a>


        <section class="auth-card">


            <div class="auth-brand">

                <div class="auth-crown">

                    ♛

                </div>

                <h1>

                    EMPIRE OF KINGS

                </h1>

                <p>

                    Enter the realm.

                </p>

            </div>



            <div class="auth-heading">

                <h2>

                    Login

                </h2>

                <p>

                    Masuk ke akun kerajaanmu.

                </p>

            </div>



            <form id="login-form">


                <div class="auth-field">

                    <label for="email">

                        Email

                    </label>

                    <input

                        type="email"

                        id="email"

                        name="email"

                        placeholder="nama@email.com"

                        autocomplete="email"

                        required

                    >

                </div>



                <div class="auth-field">

                    <label for="password">

                        Password

                    </label>


                    <div class="password-wrapper">

                        <input

                            type="password"

                            id="password"

                            name="password"

                            placeholder="Masukkan password"

                            autocomplete="current-password"

                            required

                        >

                        <button

                            type="button"

                            class="password-toggle"

                            data-toggle-password="password"

                        >

                            Lihat

                        </button>

                    </div>

                </div>



                <p

                    id="auth-message"

                    class="auth-message"

                    aria-live="polite"

                ></p>



                <button

                    type="submit"

                    class="auth-button"

                    id="login-submit"

                >

                    Masuk ke Dunia

                </button>


            </form>



            <div class="auth-footer">

                Belum memiliki akun?

                <a href="register.html">

                    Daftar sekarang

                </a>

            </div>


        </section>



        <p class="auth-copyright">

            © 2026 Empire of Kings

        </p>


    </main>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>


</body>

</html>
